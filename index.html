    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
    let activeScence = [];
    let active_workSheet = [];
    let BgPaths = [];
    activeDict = {};
    let imagePaths = [];
    let question_Type = "";
    window.fetchActiveData = function () {
        fetch("questionData.xlsx?t=" + new Date().getTime()) // 加入時間戳記，避免快取
            .then(response => response.arrayBuffer())
            .then(data => {
                let workbook = XLSX.read(data, { type: "array" });
                let sheetName = "Setting";
                let worksheet = workbook.Sheets[sheetName];

                // 解析 Excel，確保 raw: true，並略過 row_no 欄位
                let jsonData = XLSX.utils.sheet_to_json(worksheet, { raw: true, defval: "" });
                jsonData = jsonData.map(row => {
                    let { row_no, ...rest } = row;
                    return rest;
                });

                activeScence = jsonData.map(row => row.activeScence).filter(path => path);
                active_workSheet = jsonData.map(row => row.active_workSheet).filter(path => path);
                BgPaths = jsonData
                    .map(row => row.background)
                    .filter(path => path)
                    .map(path => path.replace(/\\/g, "/"));

                if (activeScence.length > 1) {
                    for (let i = 0; i < activeScence.length; i++) {
                        activeDict[activeScence[i]] = [active_workSheet[i], BgPaths[i]];
                    }
                }

                console.log("取得啟動資料：", activeDict);

                // 確保 fetch 完成後傳回 Unity
                let jsonString = JSON.stringify(activeScence);
                if (window.uarGameInstance) {
                    window.uarGameInstance.SendMessage('GameManager', 'getNameFormExcel', jsonString);
                } else {
                    console.error("Unity WebGL 尚未初始化！");
                }
            })
            .catch(error => console.error("讀取 Excel 發生錯誤:", error));
    };

    //亂數產生
    const RamdomNum = new Set(); //類似陣列 (Array)，但不會新增重複的數值
    let userName = genRandomName(6);
    function genRandomName(length) {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        let result = "";

        do {
            result = "";
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
        } while (RamdomNum.has(result)); //類似Contains

        RamdomNum.add(result);
        return result;
    }
    function send_UserData(){
        let data = `${userName},${question_Type}`;
        window.uarGameInstance.SendMessage('GameManager', 'receiveUserName', data);
    }
    window.SendGameInfo = function (sceneName) {

        fetch("questionData.xlsx?t=" + new Date().getTime())
            .then(response => response.arrayBuffer())
            .then(data => {
                let workbook = XLSX.read(data, { type: "array" });

                let value = activeDict[sceneName];  // 場景 為 key
                let sheetName =  value ? value[0] : " ";   //value 存在，就取第一個元素，否則返回" "
                let worksheet = sheetName ? workbook.Sheets[sheetName] : null;//防呆
                question_Type = sheetName;
                if (!worksheet) {
                    console.error("無法找到工作表！");
                    return;
                }
                send_UserData();
                let rawData = XLSX.utils.sheet_to_json(worksheet, { raw: true });
                let jsonData = rawData.map(row => {
                    // 有A、 B、C 全部存在 → 回傳完整選項
                    if (row.optionB && row.optionC) {
                        return {
                            question: row.question,
                            optionA: row.optionA,
                            optionB: row.optionB,
                            optionC: row.optionC,
                            answer: row.answer
                        };
                        //只有題目和選項A
                    } else if (row.question && row.optionA) {
                        return {
                            question: row.question,
                            optionA: row.optionA
                        };
                        //沒有題目-> 排序
                        //等於 if (row.question === undefined || row.question === null || row.question === "")
                    } else if (!row.question) {
                        return {
                            optionA: row.optionA,
                            optionB: row.optionB,
                            optionC: row.optionC,
                            answer: row.answer
                        };
                    }
                }).filter(row => row !== null); // 過濾掉為 null 的項目

                console.log("開始傳送:\n" + JSON.stringify(jsonData, null, 2));
                // 確保 Unity 初始化後再發送
                if (window.uarGameInstance) {
                    sendDataInChunks(jsonData, 10);
                } else {
                    console.error("Unity 尚未初始化，無法傳送資料！");
                }
            })
            .catch(error => {
                console.error("讀取 Excel 失敗:", error);
            });
    }

    function sendDataInChunks(data, chunkSize) {
        let index = 0;
        function sendNext() {
            if (index >= data.length) {
                console.log("所有資料已傳送完成！");
                return;
            }

            let chunk = data.slice(index, index + chunkSize);
            let jsonString = JSON.stringify(chunk);

            // 限制資料大小（再小心一些）
            if (jsonString.length > 1024 * 40) {
                console.error("JSON 資料過大", jsonString.length);
                index += chunkSize;
                setTimeout(sendNext, 1000); // 延長延遲時間
                return;
            }

            // 確保 Unity WebGL 已初始化
            if (window.uarGameInstance) {
                try {
                    //console.log(`發送資料第 ${index + 1} 到 ${index + chunk.length} 筆`);
                    window.uarGameInstance.SendMessage('SaveInfo', 'GetData', jsonString);
                    //console.log(`已傳送第 ${index + 1} 到 ${index + chunk.length} 筆資料`);

                    index += chunkSize; // 更新 index
                    setTimeout(sendNext, 500); //延遲後遞迴呼叫
                } catch (error) {
                    console.error("Unity 傳輸錯誤，重試中...", error);
                    setTimeout(sendNextChunk, 2000); // 增加重試時間
                }
            } else {
                console.warn("Unity 尚未初始化，等待 1 秒後重試...");
                setTimeout(sendNextChunk, 2000); // 1 秒後重試
            }
        }

        sendNextChunk();
    }

    window.sendBackground = function (message) {
        localStorage.clear();
        sessionStorage.clear();
        let value = activeDict[message];  // message 為 key
        let BgPath = value ? value[1] : null;  //value 存在，就取第一個元素，否則返回 null
        if (!BgPath) {
            console.error("無法發送空的圖片路徑");
            return;
        }

        let imgElement = new Image();
        imgElement.src = BgPath;

        imgElement.onload = function () {
            fetch(imgElement.src)
                .then(response => response.blob())
                .then(blob => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64String = reader.result.split(",")[1];

                        // 確保 Unity WebGL 已初始化
                        if (window.uarGameInstance) {
                            window.uarGameInstance.SendMessage('UIManager', 'ReceiveBackground', base64String);
                        } else {
                            console.error("Unity WebGL 尚未初始化！");
                        }
                    };
                    reader.readAsDataURL(blob);
                })
                .catch(error => {
                    console.error("圖片讀取失敗:", error);
                });
        };

    }
    //按鈕功能
    window.allImage = [];
    window.BtnPathIndex = 0;
    window.fetchImage = function (imagePath) {
        localStorage.clear();
        sessionStorage.clear();
        if (!imagePath) {
            console.error("無法發送空的圖片路徑");
            return;
        }

        // 將圖片路徑加入佇列
        window.allImage.push(imagePath);

        // 如果是第一次呼叫或佇列剛加入，啟動發送流程
        if (window.allImage.length === 1 && window.BtnPathIndex === 0) {
            sendNextImage_Btn();
        }
    };

    function sendNextImage_Btn() {
        if (window.BtnPathIndex >= window.allImage.length) {
            // 所有圖片已處理完畢
            console.log("所有圖片已發送至 Unity。");
            window.allImage = [];
            window.BtnPathIndex = 0;
            return;
        }

        const imagePath = window.allImage[window.BtnPathIndex];
        const imgElement = new Image();
        imgElement.src = imagePath;

        imgElement.onload = function () {
            fetch(imgElement.src)
                .then(response => response.blob())
                .then(blob => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64String = reader.result.split(",")[1];

                        if (window.uarGameInstance) {
                            window.uarGameInstance.SendMessage('UIManager', 'ReceiveImage', base64String);
                            //console.log("已送出第", window.currentIndex + 1, "張：", imagePath);
                        } else {
                            console.error("Unity WebGL 尚未初始化！");
                        }

                        // 等 1 秒後再送下一張（避免 Unity 無法即時處理）
                        window.BtnPathIndex++;
                        setTimeout(sendNextImage_Btn, 300); // 調大延遲可提高成功率
                    };
                    reader.readAsDataURL(blob);
                })
                .catch(error => {
                    console.error("圖片讀取失敗:", error);
                    window.BtnPathIndex++;
                    setTimeout(sendNextImage_Btn, 1000); // 繼續下一張
                });
        };

        imgElement.onerror = function () {
            console.error("圖片載入錯誤：", imagePath);
            window.BtnPathIndex++;
            setTimeout(sendNextImage_Btn, 1000);
        };
    }

    window.imageQueue = [];
    window.currentIndex = 0;

    window.fetchGameBg = function (imagePath) {
        if (!imagePath) {
            console.error("無法發送空的圖片路徑");
            return;
        }

        // 將圖片路徑加入佇列
        window.imageQueue.push(imagePath);

        // 如果是第一次呼叫或佇列剛加入，啟動發送流程
        if (window.imageQueue.length === 1 && window.currentIndex === 0) {
            sendNextImage();
        }
    };

    function sendNextImage() {
        if (window.currentIndex >= window.imageQueue.length) {
            // 所有圖片已處理完畢
            console.log("所有圖片已發送至 Unity。");
            window.imageQueue = [];
            window.currentIndex = 0;
            return;
        }

        const imagePath = window.imageQueue[window.currentIndex];
        const imgElement = new Image();
        imgElement.src = imagePath;

        imgElement.onload = function () {
            fetch(imgElement.src)
                .then(response => response.blob())
                .then(blob => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64String = reader.result.split(",")[1];

                        if (window.uarGameInstance) {
                            window.uarGameInstance.SendMessage('UIManager', 'ReceiveGameBg', base64String);
                            //console.log("已送出第", window.currentIndex + 1, "張：", imagePath);
                        } else {
                            console.error("Unity WebGL 尚未初始化！");
                        }

                        // 等 1 秒後再送下一張（避免 Unity 無法即時處理）
                        window.currentIndex++;
                        setTimeout(sendNextImage, 500); // 調大延遲可提高成功率
                    };
                    reader.readAsDataURL(blob);
                })
                .catch(error => {
                    console.error("圖片讀取失敗:", error);
                    window.currentIndex++;
                    setTimeout(sendNextImage, 1000); // 繼續下一張
                });
        };

        imgElement.onerror = function () {
            console.error("圖片載入錯誤：", imagePath);
            window.currentIndex++;
            setTimeout(sendNextImage, 1000);
        };
    }
    let Scence = [];
    let Btn1 = [];
    let Btn2 = [];
    let Btn3 = [];
    let Btn4 = [];
    let btnDict = {};
    window.fetchBtn = function () {
        //console.log("111");
        fetch("questionData.xlsx?t=" + new Date().getTime()) // 加入時間戳記，避免快取
            .then(response => response.arrayBuffer())
            .then(data => {
                let workbook = XLSX.read(data, { type: "array" });
                let sheetName = "editButton";
                let worksheet = workbook.Sheets[sheetName];

                // 解析 Excel，確保 raw: true
                let jsonData = XLSX.utils.sheet_to_json(worksheet, { raw: true, defval: "" });

                Scence = jsonData.map(row => row.ScenceName).filter(path => path);
                Btn1 = jsonData
                    .map(row => row.Button1)
                    .filter(path => path)
                    .map(path => path.replace(/\\/g, "/"));
                Btn2 = jsonData
                    .map(row => row.Button2) // 指定欄位
                    .filter(path => path) // 過濾掉空值
                    .map(path => path.replace(/\\/g, "/"));
                Btn3 = jsonData
                    .map(row => row.Button3) // 指定欄位
                    .filter(path => path) // 過濾掉空值
                    .map(path => path.replace(/\\/g, "/"));
                Btn4 = jsonData
                    .map(row => row.Button4) // 指定欄位
                    .filter(path => path) // 過濾掉空值
                    .map(path => path.replace(/\\/g, "/"));
                if (Btn1.length > 1) {
                    for (let i = 0; i < Scence.length; i++) {
                        btnDict[Scence[i]] = [Btn1[i], Btn2[i], Btn3[i], Btn4[i]];
                    }
                }
                console.table(btnDict);

            })
            .catch(error => console.error("載入按鈕資料失敗", error));
    }

    window.FindBtnData = function (message) {
        console.log("message", message);  // 顯示傳入的 key
        let value = btnDict[message];  // 查找對應的值
        if (value) {
            //console.log("value", value); 
            let jsonString = JSON.stringify(value);
            if (window.uarGameInstance) {
                window.uarGameInstance.SendMessage('GameManager', 'getBtnDataFormExcel', jsonString);
            } else {
                console.error("Unity WebGL 尚未初始化！");
            }
        } else {
            console.log("找不到對應的按鈕資料", message);  // 顯示錯誤訊息
        }
    }
</script>

<script>

    window.playVideo = function (url) {
        let videoElement = document.getElementById("videoPlayer");
        let modalElement = document.getElementById("videoModal");

        if (!videoElement) {
            console.error("找不到 videoPlayer");
            return;
        }

        if (!modalElement) {
            console.error("找不到 videoModal");
            return;
        }

        let modal = new bootstrap.Modal(modalElement);

        videoElement.src = url;  // **先設定影片來源

        // **顯示 Modal**
        modal.show();
        //確保使用者點了Btn
        videoElement.play().catch(error => {
            console.log("播放失敗，嘗試喚醒 AudioContext", error);
            videoElement.muted = true; // **靜音模式強制播放**
            videoElement.play();
        });
    }
    function StopVideo() {
        let videoModal = document.getElementById("videoModal");
        let videoElement = document.getElementById("videoPlayer");

        if (!videoModal || !videoElement) {
            console.error("找不到 videoModal 或 videoPlayer");
            return;
        }
        let modalInstance = bootstrap.Modal.getInstance(videoModal);

        if (modalInstance) {
            modalInstance.hide();  // 隱藏 Modal
        } else {
            // 如果 Modal 尚未被初始化，則強制初始化並隱藏
            modalInstance = new bootstrap.Modal(videoModal);
            modalInstance.hide();
        }


        console.log("影片已強制停止");
    }

    //旋轉
    function RequestSensorPermission() {
        console.log("傳送給 Unity:");
        //向使用者請求感應器權限
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                //permissionState 回傳結果
                .then(permissionState => {
                    //得到granted 就給權限
                    if (permissionState === 'granted') {
                        //deviceorientation 行動裝置的移動方向
                        window.addEventListener("deviceorientation", sendOrientationData);
                    }
                })
                .catch(console.error);
        } else {
            // 如果不需要手動請求權限（如 Android 或舊版 iOS）
            window.addEventListener("deviceorientation", sendOrientationData);
        }
    }

    let lastBeta = 0, lastGamma = 0, lastAlpha = 0, greaterThan = 0.4;
    function sendOrientationData(event) {
        if (window.uarGameInstance) {
            let gamma = event.gamma || 0;
            let beta = event.beta || 0;
            let alpha = event.alpha || 0;

            gamma = gamma * 1.2
            let deltaBeta = Math.abs(beta - lastBeta);
            let deltaAlpha = Math.abs(alpha - lastAlpha);
            let deltGamma = Math.abs(gamma - lastGamma);
            beta = beta * 5.2;

            if (deltGamma > 0.00001 && gamma > 20) {
                beta = lastBeta;
            }

            lastBeta = beta;
            lastAlpha = alpha;
            lastGamma = gamma;

            let data = `${beta},${gamma},${deltGamma},${alpha},${deltaAlpha}`;
            window.uarGameInstance.SendMessage('CameraManager', 'UpdateCamera', data);
        }
    }


    window.getGameRecode = function (data) {
      let obj = (typeof data === "string") ? JSON.parse(data) : data;

      // 把物件轉換成 query string
      let params = new URLSearchParams(obj).toString();

      // 把參數加到網址後面
      let url = "https://script.google.com/macros/s/AKfycbwUUcb1GjKzIOY256UQY9MtNWYwhXEKuGs57TafwZ-F2lfO0TCZKGwmbG0IGsJG9zE8/exec?" + params;

      // GET 請求
      fetch(url, {
        method: "GET"
      })
        .then(res => res.text())
        .then(msg => console.log("Google 回應:", msg))
        .catch(err => console.error("錯誤:", err));
    }

</script>
<!-- 設定API 視窗 -->
<div class="modal fade" id="SettingModal" tabindex="-1" aria-labelledby="SettingModalLabel" aria-hidden="true"
    style="z-index: 999999;">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
            <div class="modal-header text-white">
                <h5 class="modal-title fw-bold" id="SettingModalLabel" style="color: black;">設定API KEY(目前支援gemini)
                </h5>
                <button type="button" class="btn-close " data-bs-dismiss="modal" aria-label="關閉"
                    style="color: black;"></button>
            </div>
            <div class="modal-body text-center">
                <input type="text" id="password" placeholder="請複製貼上 API Key" class="form-control mb-3 mt-4"
                    style="padding: 10px; font-size: 16px; border-width: 2px;">
                <p class="fs-5" style="color: rgb(255, 39, 39);" id="success"></p>
            </div>

            <div class="modal-footer justify-content-center">
                <button onclick="pasteAPIKey()" class="btn btn-success px-4 fs-5">貼上</button>
                <button onclick="SendSetting()" class="btn btn-primary px-4 fs-5">確認</button>
            </div>
        </div>
    </div>
</div>
<script>
    window.disableUnityKeyboardInput = true;

    document.addEventListener("keydown", function (e) {
        const active = document.activeElement;
        if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) {
            e.stopPropagation();
        }
    }, true);

    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById('SettingModal').addEventListener('hidden.bs.modal', function () {
            document.getElementById('unity-canvas').classList.remove("disable-events");
        });
    });

    document.getElementById("password").addEventListener("keydown", function (e) {
        e.stopPropagation();
    });
    function ShowSetting() {
        const modal = new bootstrap.Modal(document.getElementById('SettingModal'));
        modal.show();
        console.log("Modal opened");

        document.getElementById('unity-canvas').classList.add("disable-events");

        setTimeout(() => {
            const input = document.getElementById("password");
            input.blur();
            input.focus();
            console.log("Focused input");
        }, 200);
    }

    function SendSetting() {
        const API = document.getElementById("password").value;
        window.uarGameInstance.SendMessage('ConnectAi', 'SetApiKey', API);

        if (API) {
            document.getElementById("success").innerText = "API Key 已成功設定！";
        } else {
            document.getElementById("success").innerText = "請輸入 API Key！";
        }

    }
    function pasteAPIKey() {
        if (navigator.clipboard && navigator.clipboard.readText) {
            navigator.clipboard.readText().then(text => {
                document.getElementById("password").value = text;
                document.getElementById("success").innerText = "API Key 已成功設定！";
            }).catch(err => {
                alert("無法存取剪貼簿" + err);
            });
        } 
    }

</script>
