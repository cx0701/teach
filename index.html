      <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    function fixUnityCanvasSize() {
      const canvas = document.getElementById("unity-canvas");
      if (!canvas) return;

      let w = window.visualViewport ? window.visualViewport.width : window.innerWidth;
      let h = window.visualViewport ? window.visualViewport.height : window.innerHeight;

      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
    }

    window.addEventListener("resize", fixUnityCanvasSize);
    window.addEventListener("orientationchange", () => setTimeout(fixUnityCanvasSize, 300));

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", fixUnityCanvasSize);
      window.visualViewport.addEventListener("scroll", fixUnityCanvasSize);
    }

    let activeScence = [];
    let active_workSheet = [];
    let BgPaths = [];
    let game_playtime = [];
    let activeDict = {};
    let imagePaths = [];
    let question_bank = "";//sheet name
    window.fetchActiveData = function () {
      fetch("questionData.xlsx?t=" + new Date().getTime()) // 加入時間戳記，避免快取
        .then(response => response.arrayBuffer())
        .then(data => {
          let workbook = XLSX.read(data, { type: "array" });
          let sheetName = "Setting";
          let worksheet = workbook.Sheets[sheetName];

          // 解析 Excel，確保 raw: true，並略過 row_no 欄位
          let jsonData = XLSX.utils.sheet_to_json(worksheet, { raw: true, defval: "" });
          jsonData = jsonData.map(row => {
            let { row_no, ...rest } = row;
            return rest;
          });

          activeScence = jsonData.map(row => row.active_Scence).filter(path => path);
          active_workSheet = jsonData.map(row => row.active_workSheet).filter(path => path);
          BgPaths = jsonData
            .map(row => row.background)
            .filter(path => path)
            .map(path => path.replace(/\\/g, "/"));
          game_playtime = jsonData.map(row => row.game_playtime).filter(t => t);

          if (activeScence.length > 1) {
            for (let i = 0; i < activeScence.length; i++) {
              activeDict[activeScence[i]] = [active_workSheet[i], BgPaths[i], game_playtime[i]];
            }
          }

          console.log("取得啟動資料：", activeDict);

          // 確保 fetch 完成後傳回 Unity
          let jsonString = JSON.stringify(activeScence);
          if (window.uarGameInstance) {
            window.uarGameInstance.SendMessage('GameManager', 'fromExcel', jsonString);
          } else {
            console.error("Unity WebGL 尚未初始化！");
          }
        })
        .catch(error => console.error("讀取 Excel 發生錯誤:", error));
    };

    window.sendGamePlayTime = function (message) {
      localStorage.clear();
      sessionStorage.clear();
      let value = activeDict[message];  // message 為 key
      let game_playtime = value ? value[2] : null;  //value 存在，就取第一個元素，否則返回 null
      if (!game_playtime) {
        console.error("遊戲時間資料不存在");
        return;
      }
      console.log("game_playtime" + game_playtime);
      // 確保 Unity WebGL 已初始化
      if (window.uarGameInstance) {
        window.uarGameInstance.SendMessage('GameManager', 'getGamePlayTime', String(game_playtime));
      } else {
        console.error("Unity WebGL 尚未初始化！");
      }
    }

    window.SendGameInfo = function (sceneName) {
      fetch("questionData.xlsx?t=" + new Date().getTime())
        .then(response => response.arrayBuffer())
        .then(data => {
          let workbook = XLSX.read(data, { type: "array" });

          let value = activeDict[sceneName];  // message 為 key
          let firstValue = value ? value[0] : null;  //value 存在，就取第一個元素，否則返回 null
          let sheetName = firstValue;
          let worksheet = sheetName ? workbook.Sheets[sheetName] : null;//防呆

          if (!worksheet) {
            console.error("無法找到工作表！");
            return;
          }
          let rawData = XLSX.utils.sheet_to_json(worksheet, { raw: true });
          let jsonData = rawData.map(row => {
            // 有A、 B、C 全部存在 → 回傳完整選項
            if (row.optionB && row.optionC) {
              return {
                question: row.question,
                optionA: row.optionA,
                optionB: row.optionB,
                optionC: row.optionC,
                answer: row.answer || null
              };
            } else if (row.question && row.optionA) {
              return {
                question: row.question,
                optionA: row.optionA
              };
            }
          }).filter(row => row !== null); // 過濾掉為 null 的項目

          console.log("開始傳送:\n" + JSON.stringify(jsonData, null, 2));
          // 確保 Unity 初始化後再發送
          if (window.uarGameInstance) {
            sendDataInChunks(jsonData, 10);
          } else {
            console.error("Unity 尚未初始化，無法傳送資料！");
          }
        })
        .catch(error => {
          console.error("讀取 Excel 失敗:", error);
        });
    };

    function sendDataInChunks(data, chunkSize) {
      let index = 0;
      function sendNext() {
        if (index >= data.length) {
          console.log("所有資料已傳送完成！");
          return;
        }

        let chunk = data.slice(index, index + chunkSize);
        let jsonString = JSON.stringify(chunk);

        // 限制資料大小（再小心一些）
        if (jsonString.length > 1024 * 40) {
          console.error("JSON 資料過大", jsonString.length);
          index += chunkSize;
          setTimeout(sendNext, 1000); // 延長延遲時間
          return;
        }

        // 確保 Unity WebGL 已初始化
        if (window.uarGameInstance) {
          try {
            //console.log(`發送資料第 ${index + 1} 到 ${index + chunk.length} 筆`);
            window.uarGameInstance.SendMessage('SaveInfo', 'GetData', jsonString);
            //console.log(`已傳送第 ${index + 1} 到 ${index + chunk.length} 筆資料`);

            index += chunkSize; // 更新 index
            setTimeout(sendNext, 500); //延遲後遞迴呼叫
          } catch (error) {
            console.error("Unity 傳輸錯誤，重試中...", error);
            setTimeout(sendNext, 2000); // 增加重試時間
          }
        } else {
          console.warn("Unity 尚未初始化，等待 1 秒後重試...");
          setTimeout(sendNext, 2000); // 1 秒後重試
        }
      }

      sendNext();
    }

    window.sendBackground = function (message) {
      console.log("傳送背景");
      localStorage.clear();
      sessionStorage.clear();
      let value = activeDict[message];  // message 為 key
      let BgPath = value ? value[1] : null;  //value 存在，就取第一個元素，否則返回 null
      if (!BgPath) {
        console.error("無法發送空的圖片路徑");
        return;
      }

      let imgElement = new Image();
      imgElement.src = BgPath;

      imgElement.onload = function () {
        fetch(imgElement.src)
          .then(response => response.blob())
          .then(blob => {
            const reader = new FileReader();
            reader.onloadend = () => {
              const base64String = reader.result.split(",")[1];

              // 確保 Unity WebGL 已初始化
              if (window.uarGameInstance) {
                window.uarGameInstance.SendMessage('UIManager', 'ReceiveBackground', base64String);
              } else {
                console.error("Unity WebGL 尚未初始化！");
              }
            };
            reader.readAsDataURL(blob);
          })
          .catch(error => {
            console.error("圖片讀取失敗:", error);
          });
      };

    }
    //按鈕功能
    window.allImage = [];
    window.BtnPathIndex = 0;
    window.fetchImage = function (imagePath) {
      localStorage.clear();
      sessionStorage.clear();
      if (!imagePath) {
        console.error("無法發送空的圖片路徑");
        return;
      }

      // 將圖片路徑加入佇列
      window.allImage.push(imagePath);

      // 如果是第一次呼叫或佇列剛加入，啟動發送流程
      if (window.allImage.length === 1 && window.BtnPathIndex === 0) {
        sendNextImage_Btn();
      }
    };

    function sendNextImage_Btn() {
      if (window.BtnPathIndex >= window.allImage.length) {
        // 所有圖片已處理完畢
        console.log("所有圖片已發送至 Unity。");
        window.allImage = [];
        window.BtnPathIndex = 0;
        return;
      }

      const imagePath = window.allImage[window.BtnPathIndex];
      const imgElement = new Image();
      imgElement.src = imagePath;

      imgElement.onload = function () {
        fetch(imgElement.src)
          .then(response => response.blob())
          .then(blob => {
            const reader = new FileReader();
            reader.onloadend = () => {
              const base64String = reader.result.split(",")[1];

              if (window.uarGameInstance) {
                window.uarGameInstance.SendMessage('UIManager', 'ReceiveImage', base64String);
                //console.log("已送出第", window.currentIndex + 1, "張：", imagePath);
              } else {
                console.error("Unity WebGL 尚未初始化！");
              }

              // 等 1 秒後再送下一張（避免 Unity 無法即時處理）
              window.BtnPathIndex++;
              setTimeout(sendNextImage_Btn, 200); // 調大延遲可提高成功率
            };
            reader.readAsDataURL(blob);
          })
          .catch(error => {
            console.error("圖片讀取失敗:", error);
            window.BtnPathIndex++;
            setTimeout(sendNextImage_Btn, 1000); // 繼續下一張
          });
      };

      imgElement.onerror = function () {
        console.error("圖片載入錯誤：", imagePath);
        window.BtnPathIndex++;
        setTimeout(sendNextImage_Btn, 1000);
      };
    }
    //按鈕功能
    window.allImage = [];
    window.BtnPathIndex = 0;
    window.imageQueue = [];
    window.currentIndex = 0;

    window.fetchGameBg = function (imagePath) {
      if (!imagePath) {
        console.error("無法發送空的圖片路徑");
        return;
      }

      // 將圖片路徑加入佇列
      window.imageQueue.push(imagePath);

      // 如果是第一次呼叫或佇列剛加入，啟動發送流程
      if (window.imageQueue.length === 1 && window.currentIndex === 0) {
        sendNextImage();
      }
    };

    function sendNextImage() {
      if (window.currentIndex >= window.imageQueue.length) {
        // 所有圖片已處理完畢
        console.log("所有圖片已發送至 Unity。");
        window.imageQueue = [];
        window.currentIndex = 0;
        return;
      }

      const imagePath = window.imageQueue[window.currentIndex];
      const imgElement = new Image();
      imgElement.src = imagePath;

      imgElement.onload = function () {
        fetch(imgElement.src)
          .then(response => response.blob())
          .then(blob => {
            const reader = new FileReader();
            reader.onloadend = () => {
              const base64String = reader.result.split(",")[1];

              if (window.uarGameInstance) {
                window.uarGameInstance.SendMessage('UIManager', 'ReceiveGameBg', base64String);
                //console.log("已送出第", window.currentIndex + 1, "張：", imagePath);
              } else {
                console.error("Unity WebGL 尚未初始化！");
              }

              // 等 1 秒後再送下一張（避免 Unity 無法即時處理）
              window.currentIndex++;
              setTimeout(sendNextImage, 100); // 調大延遲可提高成功率
            };
            reader.readAsDataURL(blob);
          })
          .catch(error => {
            console.error("圖片讀取失敗:", error);
            window.currentIndex++;
            setTimeout(sendNextImage, 1000); // 繼續下一張
          });
      };

      imgElement.onerror = function () {
        console.error("圖片載入錯誤：", imagePath);
        window.currentIndex++;
        setTimeout(sendNextImage, 1000);
      };
    }
    window.findBtnData = function (message) {
      //console.log("findBtnData", message);  // 顯示傳入的 key
      let value = btnDict[message];  // 查找對應的值
      if (value) {
        console.log("btn", value);
        let jsonString = JSON.stringify(value);
        if (window.uarGameInstance) {
          window.uarGameInstance.SendMessage('GameManager', 'getBtnDataFromExcel', jsonString);
        } else {
          console.error("Unity WebGL 尚未初始化！");
        }
      } else {
        console.log("找不到對應的按鈕資料", message);  // 顯示錯誤訊息
      }
    }

  </script>

  <script>

    window.playVideo = function (url) {
      let videoElement = document.getElementById("videoPlayer");
      let modalElement = document.getElementById("videoModal");

      if (!videoElement) {
        console.error("找不到 videoPlayer");
        return;
      }

      if (!modalElement) {
        console.error("找不到 videoModal");
        return;
      }

      let modal = new bootstrap.Modal(modalElement);

      videoElement.src = url;  // **先設定影片來源

      //顯示 Modal
      modal.show();
      //確保使用者點了Btn
      videoElement.play().catch(error => {
        console.log("播放失敗，嘗試喚醒 AudioContext", error);
        videoElement.muted = true; // **靜音模式強制播放**
        videoElement.play();
      });
    }
    function StopVideo() {
      let videoModal = document.getElementById("videoModal");
      let videoElement = document.getElementById("videoPlayer");

      if (!videoModal || !videoElement) {
        console.error("找不到 videoModal 或 videoPlayer");
        return;
      }
      videoElement.pause();
      videoElement.currentTime = 0;  // 回到開頭

      //移除影片來源
      videoElement.src = "";

      //關閉 Modal
      let modalInstance = bootstrap.Modal.getInstance(videoModal);
      if (modalInstance) {
        modalInstance.hide();
      } else {
        modalInstance = new bootstrap.Modal(videoModal);
        modalInstance.hide();
      }

      console.log("影片已停止並清空來源");
    }


    //旋轉
    function RequestSensorPermission() {
      console.log("傳送行動裝置的移動方向給 Unity:");
      //向使用者請求感應器權限
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          //permissionState 回傳結果
          .then(permissionState => {
            //得到granted 就給權限
            if (permissionState === 'granted') {
              //deviceorientation 行動裝置的移動方向
              window.addEventListener("deviceorientation", sendOrientationData);
            }
          })
          .catch(console.error);
      } else {
        // 如果不需要手動請求權限（如 Android 或舊版 iOS）
        window.addEventListener("deviceorientation", sendOrientationData);
      }
    }

    let lastBeta = 0, lastGamma = 0, lastAlpha = 0, greaterThan = 0.4;
    function sendOrientationData(event) {
      if (window.uarGameInstance) {
        let gamma = event.gamma || 0;
        let beta = event.beta || 0;
        let alpha = event.alpha || 0;

        gamma = gamma * 1.2
        let deltaBeta = Math.abs(beta - lastBeta);
        let deltaAlpha = Math.abs(alpha - lastAlpha);
        let deltGamma = Math.abs(gamma - lastGamma);
        beta = beta * 5.2;

        if (deltGamma > 0.00001 && gamma > 20) {
          beta = lastBeta;
        }

        lastBeta = beta;
        lastAlpha = alpha;
        lastGamma = gamma;

        let data = `${beta},${gamma},${deltGamma},${alpha},${deltaAlpha}`;
        window.uarGameInstance.SendMessage('CameraManager', 'UpdateCamera', data);
      }
    }

          <button onclick="SendSetting()" class="btn btn-primary px-4 fs-5">確認</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    function togglePassword() {
      const input = document.getElementById("password");
      input.type = input.type === "password" ? "text" : "password";
    }
    let API = document.getElementById("password").value;
    window.disableUnityKeyboardInput = true;

    document.addEventListener("keydown", function (e) {
      const active = document.activeElement;
      if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) {
        e.stopPropagation();
      }
    }, true);

    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById('SettingModal').addEventListener('hidden.bs.modal', function () {
        document.getElementById('unity-canvas').classList.remove("disable-events");
      });
    });

    document.getElementById("password").addEventListener("keydown", function (e) {
      e.stopPropagation();
    });
    function ShowSetting() {
      const modal = new bootstrap.Modal(document.getElementById('SettingModal'));
      modal.show();
      console.log("Modal opened");

      document.getElementById('unity-canvas').classList.add("disable-events");

      setTimeout(() => {
        const input = document.getElementById("password");
        input.blur();
        input.focus();
        console.log("Focused input");
      }, 200);
    }

    function SendSetting() {
      API = document.getElementById("password").value;
      window.uarGameInstance.SendMessage('ConnectAi', 'SetApiKey', API);

      if (API.trim()) {
        document.getElementById("success").innerText = "API Key 已成功設定！";
      } else {
        document.getElementById("success").innerText = "請輸入 API Key！";
      }

    }
    function pasteAPIKey() {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(text => {
          document.getElementById("password").value = text;
          SendSetting();
          document.getElementById("success").innerText = "API Key 已成功設定！";
        }).catch(err => {
          alert("無法存取剪貼簿" + err);
        });
      }
    }
    function sendAPI() {
      API = document.getElementById("password").value;
      if (API.trim()) {
        window.uarGameInstance.SendMessage('ConnectAi', 'SetApiKey', API);
        console.log("傳送API");
      }
    }

  </script>

  <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-fullscreen">

      <div class="modal-content bg-dark border-0 rounded-0">
        <div class="modal-header " style="z-index: 10; background-color: #ffffff; ">
          <button type="button" class="btn-close btn-close-black" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body p-0 d-flex align-items-center justify-content-center" style="position: relative;">
          <img id="modalImage" src="" alt="圖片" style="max-width: 90%; max-height: 90%; object-fit: contain;">
          <button id="prevImageBtn" class="btn btn-dark fs-1"
            style="left: 5%; position: absolute; top: 50%; transform: translateY(-50%); ">
            <p class="pe-3 pt-3">〈</p>
          </button>
          <button id="nextImageBtn" class="btn btn-dark fs-1"
            style="position: absolute; right: 5%; top: 50%; transform: translateY(-50%); ">
            <p class="ps-3 pt-3">〉</p>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    //fetchBtn();
    let Scence = [];
    let Btn1 = [], Btn2 = [], Btn3 = [], Btn4 = [];
    let btnDict = {};
    //function fetchBtn() {
    window.fetchBtn = function () {
      fetch("questionData.xlsx?t=" + new Date().getTime())
        .then(response => response.arrayBuffer())
        .then(data => {
          let workbook = XLSX.read(data, { type: "array" });
          let sheetName = "editButton";
          let worksheet = workbook.Sheets[sheetName];
          let jsonData = XLSX.utils.sheet_to_json(worksheet, { raw: true, defval: "" });

          const BtnType = (path) => {
            if (!path || path.trim() === "") return [];
            cleanPath = path.replace(/\\/g, "/");
            if (cleanPath.includes('.jpg')) return cleanPath.split(',');
            else return [cleanPath];
          };

          Scence = jsonData.map(row => row.ScenceName).filter(path => path);
          Btn1 = jsonData.map(row => row.Button1).map(BtnType);
          Btn2 = jsonData.map(row => row.Button2).map(BtnType);
          Btn3 = jsonData.map(row => row.Button3).map(BtnType);
          Btn4 = jsonData.map(row => row.Button4).map(BtnType);

          for (let i = 0; i < jsonData.length; i++) {
            const sceneName = jsonData[i].ScenceName;
            if (sceneName) {
              btnDict[sceneName] = [Btn1[i], Btn2[i], Btn3[i], Btn4[i]];
            }
          }

          console.log("載入成功：", btnDict);
        })
        .catch(error => console.error("載入按鈕資料失敗", error));


    }
    let images = [];
    //指定 Scene 的所有圖片
    //function findBtnData(SceneName) {
    window.findBtnImg = function (SceneName) {
      console.log("查找 Scene:", SceneName);
      const sceneData = btnDict[SceneName];
      if (!sceneData) {
        alert("找不到 Scene: " + SceneName);
        return;
      }

      //圖片路徑

      for (let group of sceneData) {
        if (Array.isArray(group)) {
          for (let path of group) {
            if (typeof path === "string" && path.includes(".jpg")) {
              images.push(path.trim());
            }
          }
        }
      }

      console.log("找到圖片：", images);
      if (images.length === 0) {
        alert("Scene 沒有任何圖片！");
        return;
      }

      //測試顯示 modal
      //showImageModal(images);
    }

    // 顯示圖片
    function showImage() {
      if (images == null) return;
      let currentIndex = 0;
      const modal = new bootstrap.Modal(document.getElementById("imageModal"));
      const modalImg = document.getElementById("modalImage");

      const updateImage = () => {
        modalImg.src = images[currentIndex];
      };

      document.getElementById("prevImageBtn").onclick = () => {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        updateImage();
      };

      document.getElementById("nextImageBtn").onclick = () => {
        currentIndex = (currentIndex + 1) % images.length;
        updateImage();
      };

      updateImage();
      modal.show();
    }
  </script>
</body>

</html>
