<script>
    //ID
    let userName = getDateTimeUserName();

    function getDateTimeUserName() {
        const now = new Date();
        // 格式：YYYYMMDD_HHMMSS
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        const hour = String(now.getHours()).padStart(2, "0");
        const minute = String(now.getMinutes()).padStart(2, "0");
        const second = String(now.getSeconds()).padStart(2, "0");

        return `${year}${month}${day}${hour}${minute}${second}`;
    }
    function send() {
        //取得使用者選擇的值
        const gender = document.querySelector('input[name="gender"]:checked')?.nextElementSibling.textContent.trim() || "";
        const age = document.querySelector('input[name="age"]:checked')?.nextElementSibling.textContent.trim() || "";
        const education = document.querySelector('input[name="education"]:checked')?.nextElementSibling.textContent.trim() || "";
        const user_id = userName;
        if (!gender || !age || !education) {
            alert("請完整填寫所有欄位！");
            return;
        }

        //封裝資料
        let data = {
            user_id: user_id,
            gender: gender,
            age: age,
            education: education,
        };

        let params = new URLSearchParams(data).toString();

        let url = "https://script.google.com/macros/s/AKfycbzhcAyRJzsStlkxEod1mT7Hr7E9cYoT1t6cUWMJmwbIJPi14mSEr2Iky7Yus8ma6-iK/exec" + params;

        fetch(url, {
            method: "GET"
        })
            .then(res => res.text())
            .then(msg => console.log("Google 回應:", msg))
            .catch(err => console.error("錯誤:", err));
        
    }

</script>
