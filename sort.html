<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 拖曳時「預覽位置」的樣式 */
        .sortable-ghost {
            opacity: 0.9;
            background-color: #2e6dff;
            color: #ffffff;
        }

        /* 讓選項在被拖曳時，滑鼠游標變成「移動」的圖示 */
        .list-group-item:hover {
            cursor: move;
        }
    </style>
</head>

<body>

    <div class="container mt-4 ">
        <div class="row justify-content-center " style="align-items: center;">
                <h3 class="mb-4">1. 請根據是否能提升你的學習動機，上至下排序以下選項:</h3>

                <ul class="list-unstyled  align-items-center fs-5" id="sortable-list">
                    <li class="list-group-item mb-3 rounded border border-3 shadow-sm p-2 m-3">中英配對遊戲</li>
                    <li class="list-group-item mb-3 rounded border border-3 shadow-sm p-2 m-3">分類遊戲</li>
                    <li class="list-group-item mb-3 rounded border border-3 shadow-sm p-2 m-3">翻牌遊戲</li>
                    <li class="list-group-item mb-3 rounded border border-3 shadow-sm p-2 m-3">填空遊戲</li>
                    <li class="list-group-item mb-3 rounded border border-3 shadow-sm p-2 m-3">排序遊戲</li>
                </ul>

                <div class="d-flex justify-content-center">
                    <button class="btn mt-3 fs-5 fw-bold"
                        style="align-items: center; width: 20%; background-color: #7ed957; color: #ffffff;"
                        onclick="getOrder()">送出</button>
                </div>
                <div class="alert alert-info mt-3" id="order-result" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <script>
        const sortableList = document.getElementById('sortable-list');
        let modeType = "觸控模式";
        let game1 = "";
        let game2 = "";
        let game3 = "";
        let game4 = "";
        let game5 = "";
        new Sortable(sortableList, {
            animation: 200,
            ghostClass: 'sortable-ghost'
        });

        function getOrder() {
            const items = sortableList.querySelectorAll('.list-group-item');
            const currentOrder = Array.from(items).map(item => item.textContent);
            if (currentOrder.length >= 5) {
                game1 = currentOrder[0];
                game2 = currentOrder[1];
                game3 = currentOrder[2];
                game4 = currentOrder[3];
                game5 = currentOrder[4];
            }
            //const resultDiv = document.getElementById('order-result');
            //resultDiv.style.display = 'block';
            //resultDiv.innerHTML = '<strong>目前順序：</strong><br>' + currentOrder.join('<br>');


            console.log(currentOrder);
            //建立一個物件(Object)
            const dataToSend = {
                game1: game1,
                game2: game2,
                game3: game3,
                game4: game4,
                game5: game5
            };

            //把物件轉換成 query string
            let params = new URLSearchParams(dataToSend).toString();


            // 把參數加到網址後面
            let url = "https://script.google.com/macros/s/AKfycbyNFUaWoBDiqNxZyJUntIf-Ph0dvWYVh1suM4M5bHLyoJ0M3V400miE8nDDYh_UZ09X2Q/exec?" + params;

            // GET 請求
            fetch(url, {
                method: "GET"
            })
                .then(res => res.text())
                .then(msg => console.log("Google 回應:", msg))
                .catch(err => console.error("錯誤:", err));
        }


    </script>

</body>

</html>
